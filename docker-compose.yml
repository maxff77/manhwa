services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manhwa
      POSTGRES_PASSWORD: manhwa
      POSTGRES_DB: manhwa
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manhwa -d manhwa"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
